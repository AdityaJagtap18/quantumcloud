name: quantumcloud

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantumcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantumcloud}
      POSTGRES_DB: ${POSTGRES_DB:-quantumcloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantumcloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-quantumcloud}:${POSTGRES_PASSWORD:-quantumcloud}@postgres:5432/${POSTGRES_DB:-quantumcloud}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-quantumcloud}:${POSTGRES_PASSWORD:-quantumcloud}@postgres:5432/${POSTGRES_DB:-quantumcloud}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
